name: riassunto settimanale

on:
  schedule:
    - cron: "0 18 * * 0"      # domenica 19:00/20:00 italiane
  workflow_dispatch:

jobs:
  riassunto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requisiti.txt
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Rome
        run: python -m bot riassunto --giorni 7
