name: giro giornaliero

# Il cron di GitHub è in UTC e può partire con ritardo sotto carico:
# 23:30 Europe/Rome = 22:30 UTC in ora legale, 21:30 UTC in ora solare.
# Mettiamo 22:45 UTC: in entrambi i casi i mercati USA hanno chiuso.
on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write             # serve per riscrivere il diario nel repository

concurrency:
  group: giro
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requisiti.txt

      - name: giro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Rome
        run: python -m bot giro --simboli SPY QQQ

      - name: salva il diario
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dati/diario.jsonl dati/stato.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nessuna decisione nuova da salvare"
          else
            git commit -m "giro $(date -u +%F)"
            # un altro giro potrebbe aver scritto nel frattempo
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
